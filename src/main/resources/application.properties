# ===== Application =====
spring.application.name=vehicle-rental-system
server.port=8081

# ===== Database connection (MySQL) =====
# Create the database first:  CREATE DATABASE vrs_db;
spring.datasource.url=jdbc:mysql://localhost:3306/vrs_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sandunika2002@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update = Hibernate creates/updates tables automatically from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Thymeleaf (disable cache while developing) =====
spring.thymeleaf.cache=false

# ===== File upload (for damage / document photos) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
