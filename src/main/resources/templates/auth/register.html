<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Register - VRS</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="auth-box card">
    <h2>Create Account</h2>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <form th:action="@{/register}" method="post">
        <label>Full Name</label>
        <input type="text" name="fullName" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <label>Phone Number</label>
        <input type="text" name="phone">
        <label>Role</label>
        <select name="role">
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
        </select>
        <button type="submit" class="btn">Register</button>
    </form>
    <p style="margin-top:14px;">Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
