<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard - DriveEasy Rentals</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container mt-3">
    <h1>Welcome back, <span th:text="${session.loggedInUser?.fullName}">Customer</span> 👋</h1>
    <div class="dash-layout mt-2">
        <div th:replace="~{customer/sidebar :: sidebar('home')}"></div>
        <div>
            <div class="card">
                <h2>Quick Actions</h2>
                <div class="grid grid-3">
                    <a th:href="@{/catalog}" class="btn">Book a Vehicle</a>
                    <a th:href="@{/my-bookings}" class="btn btn-secondary">View My Bookings</a>
                    <a th:href="@{/profile}" class="btn btn-secondary">Edit Profile</a>
                </div>
            </div>
            <div class="card">
                <h2>Need Help?</h2>
                <p>Vehicle broke down or had an accident? Report it instantly and our team
                   will assign a technician right away.</p>
                <a th:href="@{/emergencies/add}" class="btn btn-danger">Report an Emergency</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
