<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Report Emergency - VRS</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Report an Emergency</h1>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <form th:action="@{/emergencies/save}" th:object="${request}" method="post">
            <label>Emergency Type</label>
            <select th:field="*{emergencyType}" required>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
            <label>Location</label>
            <input type="text" th:field="*{location}" required maxlength="255">
            <label>Description</label>
            <textarea th:field="*{description}" rows="4" required maxlength="255" placeholder="What happened? e.g. engine stopped, flat tyre"></textarea>
            <button type="submit" class="btn">Submit Request</button>
        </form>
    </div>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
