<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Fuel Price</title>
</head>

<body>

<h1>Fuel Price</h1>

<form th:action="${fuelPrice.fuelPriceId == null} ? @{/fuel/save} : @{/fuel/update/{id}(id=${fuelPrice.fuelPriceId})}"
      th:object="${fuelPrice}"
      method="post">

    <label>Fuel Type:</label>

    <select th:field="*{fuelType}">
        <option value="PETROL">Petrol</option>
        <option value="DIESEL">Diesel</option>
        <option value="ELECTRIC">Electric</option>
    </select>

    <br><br>

    <label>Fuel Price:</label>

    <input type="number"
           step="0.01"
           th:field="*{price}">

    <br><br>

    <button type="submit">Save</button>

</form>

<br>

<a th:href="@{/fuel}">Back to Fuel Prices</a>

</body>

</html>
