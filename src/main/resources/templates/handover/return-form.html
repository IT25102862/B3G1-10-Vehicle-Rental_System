<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Record Return - VRS</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Record Vehicle Return</h1>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <p th:if="${#lists.isEmpty(reservations)}" class="form-hint">There are no CONFIRMED bookings waiting to be returned.</p>
        <form th:action="@{/returns/save}" th:object="${vehicleReturn}" method="post">
            <label>Reservation</label>
            <select th:field="*{reservation}" required>
                <option th:each="r : ${reservations}" th:value="${r.reservationId}"
                        th:text="'#' + ${r.reservationId} + ' - ' + ${r.vehicle?.registrationNo}"></option>
            </select>
            <label>Return Date</label>
            <input type="date" th:field="*{returnDate}" required th:max="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
            <p class="form-hint">Cannot be in the future or before the booking's pickup date.</p>
            <label>Return Time</label>
            <input type="time" th:field="*{returnTime}">
            <label>Return Mileage (km)</label>
            <input type="number" step="0.1" th:field="*{returnMileage}" min="0" max="2000000">
            <label>Fuel Level</label>
            <select th:field="*{fuelLevel}">
                <option value="">-- Select fuel level --</option>
                <option th:each="f : ${fuelLevels}" th:value="${f}" th:text="${f}"></option>
            </select>
            <label>Return Condition / Notes</label>
            <textarea th:field="*{returnCondition}" rows="3" maxlength="255"></textarea>
            <button type="submit" class="btn">Save Return</button>
        </form>
    </div>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
