<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Schedule Maintenance - VRS</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Schedule Maintenance</h1>
        <form th:action="@{/maintenance/save}" th:object="${record}" method="post">
            <label>Vehicle</label>
            <select th:field="*{vehicle}" required>
                <option th:each="v : ${vehicles}" th:value="${v.vehicleId}" th:text="${v.registrationNo + ' - ' + v.brand + ' ' + v.model}"></option>
            </select>
            <label>Maintenance Type</label>
            <input type="text" th:field="*{maintenanceType}" placeholder="Oil change, Tire rotation, Brake check..." required>
            <label>Description</label>
            <textarea th:field="*{description}" rows="3"></textarea>
            <label>Scheduled Date</label>
            <input type="date" th:field="*{scheduledDate}" required>
            <label>Estimated Cost (Rs.)</label>
            <input type="number" step="0.01" th:field="*{cost}">
            <label>Technician</label>
            <select th:field="*{technician}">
                <option th:each="t : ${technicians}" th:value="${t.employeeId}" th:text="${t.name}"></option>
            </select>
            <button type="submit" class="btn">Schedule</button>
        </form>
    </div>
</div>
</body>
</html>
