<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>New Booking - VRS</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>New Booking</h1>
        <p th:if="${error}" class="error" th:text="${error}"></p>
        <form th:action="@{/reservations/save}" th:object="${reservation}" method="post">
            <label>Vehicle</label>
            <select th:field="*{vehicle}" required>
                <option th:each="v : ${availableVehicles}" th:value="${v.vehicleId}"
                        th:text="${v.brand + ' ' + v.model + ' (' + v.registrationNo + ')'}"></option>
            </select>
            <label>Pickup Location</label>
            <input type="text" th:field="*{pickupLocation}" required>
            <label>Start Date</label>
            <input type="date" th:field="*{startDate}" required>
            <label>End Date</label>
            <input type="date" th:field="*{endDate}" required>
            <button type="submit" class="btn">Book Now</button>
        </form>
    </div>
</div>
</body>
</html>
