<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings - DriveEasy Rentals</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container mt-3">
    <div class="card">
        <div class="flex-between">
            <h1>All Bookings</h1>
            <a class="btn" th:href="@{/reservations/add}">+ New Booking</a>
        </div>
        <table>
            <tr><th>ID</th><th>Customer</th><th>Vehicle</th><th>Pickup</th><th>Return</th><th>Total</th><th>Status</th><th>Actions</th></tr>
            <tr th:each="r : ${reservations}">
                <td th:text="${r.reservationId}"></td>
                <td th:text="${r.customer?.fullName}"></td>
                <td th:text="${r.vehicle?.brand + ' ' + r.vehicle?.model}"></td>
                <td th:text="${r.startDate}"></td>
                <td th:text="${r.endDate}"></td>
                <td th:text="'Rs. ' + ${#numbers.formatDecimal(r.totalAmount,0,'COMMA',2,'POINT')}"></td>
                <td><span class="status-badge" th:classappend="'status-' + ${r.status}" th:text="${r.status}"></span></td>
                <td>
                    <a class="btn btn-small" th:href="@{/reservations/confirm/{id}(id=${r.reservationId})}"
                       th:if="${r.status.name() == 'PENDING_APPROVAL'}">Confirm</a>
                    <a class="btn btn-small btn-success" th:href="@{/reservations/complete/{id}(id=${r.reservationId})}"
                       th:if="${r.status.name() == 'CONFIRMED'}">Complete</a>
                    <a class="btn btn-small btn-danger" th:href="@{/reservations/cancel/{id}(id=${r.reservationId})}"
                       th:if="${r.status.name() != 'COMPLETED' and r.status.name() != 'CANCELLED'}">Cancel</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reservations)}"><td colspan="8">No bookings yet.</td></tr>
        </table>
    </div>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
