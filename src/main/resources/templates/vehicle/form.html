<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Form - DriveEasy Rentals</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container mt-3" style="max-width:700px;">
    <div class="card">
        <h1 th:text="${vehicle.vehicleId} ? 'Edit Vehicle' : 'Add Vehicle'">Vehicle Form</h1>

        <img th:if="${vehicle.imageUrl != null}" th:src="@{${vehicle.imageUrl}}"
             style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:10px;">

        <p th:if="${error}" class="error" th:text="${error}"></p>

        <form th:action="@{/vehicles/save}" th:object="${vehicle}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{vehicleId}">

            <!-- Field errors from @NotBlank etc. (previously the form just reloaded silently) -->
            <div class="error" th:if="${#fields.hasAnyErrors()}">
                <p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
            </div>

            <label>Vehicle Photo</label>
            <input type="file" name="imageFile" accept=".jpg,.jpeg,.png,.gif,.webp">
            <p class="form-hint">JPEG or PNG, up to 5MB. Leave empty to keep the existing photo when editing.</p>

            <div class="grid grid-2">
                <div>
                    <label>Registration No</label>
                    <input type="text" th:field="*{registrationNo}" required maxlength="15"
                           pattern="[A-Za-z0-9 \-]{4,15}" title="4-15 letters, numbers, spaces or '-', e.g. WP-CAB-1234">
                </div>
                <div>
                    <label>Category</label>
                    <select th:field="*{category}" required>
                        <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName + ' (Rs.' + c.baseRate + '/day)'}"></option>
                    </select>
                </div>
            </div>
            <div class="grid grid-2">
                <div>
                    <label>Brand</label>
                    <input type="text" th:field="*{brand}" required maxlength="50">
                </div>
                <div>
                    <label>Model</label>
                    <input type="text" th:field="*{model}" required maxlength="50">
                </div>
            </div>
            <div class="grid grid-2">
                <div>
                    <label>Year</label>
                    <input type="number" th:field="*{year}" min="1980" th:max="${#temporals.year(#temporals.createToday()) + 1}">
                </div>
                <div>
                    <label>Mileage (km)</label>
                    <input type="number" step="0.1" th:field="*{mileage}" min="0" max="2000000">
                </div>
            </div>
            <div class="grid grid-2">
                <div>
                    <label>Transmission</label>
                    <select th:field="*{transmission}">
                        <option value="Automatic">Automatic</option>
                        <option value="Manual">Manual</option>
                    </select>
                </div>
                <div>
                    <label>Fuel Type</label>
                    <select th:field="*{fuelType}">
                        <!-- Values must match the FuelType enum exactly (PETROL, DIESEL, ELECTRIC) -->
                        <option value="PETROL">Petrol</option>
                        <option value="DIESEL">Diesel</option>
                        <option value="ELECTRIC">Electric</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-2">
                <div>
                    <label>Seats</label>
                    <input type="number" th:field="*{seats}" min="1" max="60">
                </div>
                <div>
                    <label>Color</label>
                    <input type="text" th:field="*{color}" maxlength="30">
                </div>
            </div>
            <!-- Was missing from the form, so editing a vehicle erased its value -->
            <label>Fuel Consumption (km per litre)</label>
            <input type="number" step="0.1" th:field="*{fuelConsumption}" min="0.1" max="100" placeholder="e.g. 15.5">
            <label>Pickup Location / Branch</label>
            <input type="text" th:field="*{location}" placeholder="e.g. Colombo Main Branch" maxlength="100">
            <label>Description</label>
            <textarea th:field="*{description}" rows="3" placeholder="Short highlight for the catalog page" maxlength="1000"></textarea>
            <label>Availability Status</label>
            <select th:field="*{availabilityStatus}">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
            <button type="submit" class="btn">Save Vehicle</button>
        </form>
    </div>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
