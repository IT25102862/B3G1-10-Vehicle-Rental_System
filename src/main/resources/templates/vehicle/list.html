<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Management - DriveEasy Rentals</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container mt-3">
    <div class="card">
        <div class="flex-between">
            <h1>Vehicle Fleet</h1>
            <a class="btn" th:href="@{/vehicles/add}">+ Add Vehicle</a>
        </div>
        <table>
            <tr><th>Photo</th><th>Reg No</th><th>Brand/Model</th><th>Category</th><th>Daily Rate</th><th>Status</th><th>Actions</th></tr>
            <tr th:each="v : ${vehicles}">
                <td><img th:src="${v.imageUrl != null} ? @{${v.imageUrl}} : 'https://placehold.co/80x55?text=No+Img'"
                         style="width:80px;height:55px;object-fit:cover;border-radius:6px;"></td>
                <td th:text="${v.registrationNo}"></td>
                <td th:text="${v.brand + ' ' + v.model}"></td>
                <td th:text="${v.category?.categoryName}"></td>
                <td th:text="'Rs. ' + ${v.category != null ? #numbers.formatDecimal(v.category.baseRate,0,'COMMA',0,'POINT') : '-'}"></td>
                <td><span class="status-badge" th:classappend="'status-' + ${v.availabilityStatus}" th:text="${v.availabilityStatus}"></span></td>
                <td>
                    <a class="btn btn-small" th:href="@{/vehicles/edit/{id}(id=${v.vehicleId})}">Edit</a>
                    <a class="btn btn-small btn-danger" th:href="@{/vehicles/delete/{id}(id=${v.vehicleId})}"
                       onclick="return confirm('Delete this vehicle?');">Delete</a>
                </td>
            </tr>
        </table>
    </div>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
